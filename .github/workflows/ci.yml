name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: task_mgmt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d task_mgmt_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DB_DRIVER: postgresql+asyncpg
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: task_mgmt_test
      PYTHONPATH: src

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Format check with Ruff
        run: poetry run ruff format --check .

      - name: Run tests
        run: poetry run pytest -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install production dependencies
        run: poetry install --only main --no-interaction --no-ansi --no-root

      - name: Run migrations against production Neon DB
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: poetry run alembic upgrade head

      - name: Build, log in to GHCR, and push image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/task-mgmt-api:${{ github.sha }} .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/task-mgmt-api:${{ github.sha }}

