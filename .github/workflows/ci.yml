name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: task_mgmt_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d task_mgmt_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_DRIVER: postgresql+asyncpg
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: task_mgmt_test
      TEST_DB_DRIVER: postgresql+asyncpg
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: task_mgmt_test
      PYTHONPATH: src

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Poetry
        run: python -m pip install poetry

      - name: Install dependencies
        run: poetry install --with dev --no-interaction

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Format check with Ruff
        run: poetry run ruff format --check .

      - name: Run tests
        run: poetry run pytest -q

      - name: Build Docker image
        run: docker build -t task-mgmt-api .   